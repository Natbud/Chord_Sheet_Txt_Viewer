<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text File Reader/Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Text File Reader/Editor</h1>
            <div id="settings-icon">&#9881;</div>
        </div>
        <div class="main-content">
            <div id="file-browser">
                <button id="select-dir-btn">Select Directory</button>
                <h2>Files</h2>
                <ul id="file-list"></ul>
            </div>
            <div class="editor-container">
                <div class="buttons">
                    <button id="save-btn">Save File</button>
                </div>
                <textarea id="editor" placeholder="Select a file to view its content..."></textarea>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Settings</h2>
            <div class="setting">
                <label for="dark-mode-toggle">Dark Mode</label>
                <input type="checkbox" id="dark-mode-toggle">
            </div>
            <div class="setting">
                <label for="font-select">Font</label>
                <select id="font-select">
                    <option value="sans-serif">Sans-serif</option>
                    <option value="serif">Serif</option>
                    <option value="monospace">Monospace</option>
                </select>
            </div>
        </div>
    </div>
</body>
</html>
