<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathan's Text File Reader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Nathan's Text File Reader</h1>
            <div id="settings-icon">&#9881;</div>
        </div>
        <div class="main-content">
            <div id="file-browser">
                <button id="toggle-sidebar-btn">&#9776;</button>
                <button id="import-files-btn">Import Files</button>
                <input type="file" id="file-input" multiple style="display: none;">
                <div class="tabs">
                    <div class="tab active" data-tab="files">Files</div>
                    <div class="tab" data-tab="set-lists">Set Lists</div>
                    <div class="tab" data-tab="tags">Tags</div>
                </div>
                <div id="files-content" class="tab-content active">
                    <div id="file-actions">
                        <button id="select-all-btn">Select All</button>
                        <button id="select-none-btn">Select None</button>
                        <button id="delete-selected-btn">Delete Selected</button>
                        <button id="manage-tags-btn">Tag Selected</button>
                        <button id="export-selected-btn">Export Selected</button>
                        <button id="add-to-set-list-btn">Add Selected to Set List</button>
                    </div>
                    <div id="filter-container">
                        <label for="tag-filter-select">Tag Filter</label>
                        <select id="tag-filter-select">
                            <option value="">All Tags</option>
                        </select>
                    </div>
                    <ul id="file-list"></ul>
                </div>
                <div id="set-lists-content" class="tab-content">
                    <button id="manage-set-lists-btn">Manage Set Lists</button>
                    <hr>
                    <label for="set-list-select">Select Set List:</label>
                    <select id="set-list-select"></select>
                    <hr>
                    <div id="set-list-actions">
                        <button id="set-list-check-all-btn">Check All</button>
                        <button id="set-list-uncheck-all-btn">Uncheck All</button>
                        <button id="set-list-delete-selected-btn">Delete Selected</button>
                    </div>
                    <ul id="set-list-files"></ul>
                </div>
                <div id="tags-content" class="tab-content">
                    <div id="new-tag-container">
                        <input type="text" id="new-tag-name" placeholder="New tag name">
                        <button id="create-new-tag-btn">New Tag</button>
                    </div>
                    <hr>
                    <div id="tag-actions">
                        <button id="tag-check-all-btn">Check All</button>
                        <button id="tag-uncheck-all-btn">Uncheck All</button>
                        <button id="tag-delete-selected-btn">Delete Selected</button>
                    </div>
                    <ul id="tags-list"></ul>
                </div>
            </div>
            <div id="resizer"></div>
            <div class="editor-container">
                <div class="buttons">
                    <button id="back-btn">&#9664;</button>
                    <button id="forward-btn">&#9654;</button>
                    <button id="decrease-font-size-btn">-</button>
                    <button id="increase-font-size-btn">+</button>
                    <label for="background-color-picker">Bg Color</label>
                    <input type="color" id="background-color-picker">
                    <label for="text-color-picker">Text Color</label>
                    <input type="color" id="text-color-picker">
                    <button id="bold-btn">Bold</button>
                    <button id="toggle-fullscreen-btn">Full Screen</button>
                    <button id="export-song-btn">Export Song</button>
                    <button id="save-btn">Save File</button>
                </div>
                <textarea id="editor" placeholder="Select a file to view its content..."></textarea>
            </div>
        </div>
    </div>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
    // Your web app's Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDQE-4L-Gk05N1ShkZLcrQig8yPRltRT8s",
        authDomain: "chordsheettxtviewer.firebaseapp.com",
        databaseURL: "https://chordsheettxtviewer-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "chordsheettxtviewer",
        storageBucket: "chordsheettxtviewer.firebasestorage.app",
        messagingSenderId: "336810647120",
        appId: "1:336810647120:web:1349f6f9887c7ab7983b55"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="firebase.js"></script>
    <script src="script.js"></script>
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Settings</h2>
            <div class="setting">
                <label for="dark-mode-toggle">Dark Mode</label>
                <input type="checkbox" id="dark-mode-toggle">
            </div>
            <div class="setting">
                <label for="font-select">Font</label>
                <select id="font-select">
                    <option value="sans-serif">Sans-serif</option>
                    <option value="serif">Serif</option>
                    <option value="monospace">Monospace</option>
                    <option value="Calibri">Calibri</option>
                    <option value="Arial">Arial</option>
                    <option value="Verdana">Verdana</option>
                </select>
            </div>
        </div>
    </div>
    <div id="assign-tags-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Assign Tags</h2>
            <div id="modal-tags-list"></div>
            <hr>
            <input type="text" id="modal-new-tag" placeholder="New tag">
            <button id="modal-add-tag-btn">Add Tag</button>
            <hr>
            <button id="modal-add-tags-btn">Add Tags</button>
            <button id="modal-remove-tags-btn">Remove Tags</button>
            <button id="modal-close-tags-btn">Close</button>
        </div>
    </div>
    <div id="add-to-set-list-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Add to Set List</h2>
            <p>Select a set list to add the selected files to.</p>
            <select id="add-to-set-list-select"></select>
            <button id="modal-add-to-set-list-btn">Add</button>
        </div>
    </div>
    <div id="manage-set-lists-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Manage Set Lists</h2>
            <input type="text" id="set-list-name" placeholder="New set list name">
            <button id="create-set-list-btn">Create</button>
            <hr>
            <p>Select a set list to delete:</p>
            <select id="delete-set-list-select"></select>
            <button id="delete-set-list-btn">Delete</button>
        </div>
    </div>
</body>
</html>
