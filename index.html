<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nathan's Text File Reader</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Nathan's Text File Reader</h1>
            <div id="settings-icon">&#9881;</div>
        </div>
        <div class="main-content">
            <div id="file-browser">
                <button id="toggle-sidebar-btn">&#9776;</button>
                <button id="import-files-btn">Import Files</button>
                <input type="file" id="file-input" multiple style="display: none;">
                <div class="tabs">
                    <div class="tab active" data-tab="files">Files</div>
                    <div class="tab" data-tab="set-lists">Set Lists</div>
                </div>
                <div id="files-content" class="tab-content active">
                    <div id="add-to-set-list-container">
                        <select id="add-to-set-list-select"></select>
                        <button id="add-to-set-list-btn">Add to Set List</button>
                    </div>
                    <ul id="file-list"></ul>
                </div>
                <div id="set-lists-content" class="tab-content">
                    <input type="text" id="set-list-name" placeholder="New set list name">
                    <button id="create-set-list-btn">Create</button>
                    <hr>
                    <label for="set-list-select">Select Set List:</label>
                    <select id="set-list-select"></select>
                    <button id="delete-set-list-btn">Delete Selected</button>
                    <hr>
                    <button id="import-set-lists-btn">Import Set Lists</button>
                    <button id="export-set-lists-btn">Export Set Lists</button>
                    <hr>
                    <ul id="set-list-files"></ul>
                </div>
            </div>
            <div class="editor-container">
                <div class="buttons">
                    <button id="decrease-font-size-btn">-</button>
                    <button id="increase-font-size-btn">+</button>
                    <label for="background-color-picker">Bg Color</label>
                    <input type="color" id="background-color-picker">
                    <label for="text-color-picker">Text Color</label>
                    <input type="color" id="text-color-picker">
                    <button id="bold-btn">Bold</button>
                    <button id="toggle-fullscreen-btn">Full Screen</button>
                    <button id="save-btn">Save File</button>
                </div>
                <textarea id="editor" placeholder="Select a file to view its content..."></textarea>
            </div>
        </div>
    </div>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
    // Your web app's Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDQE-4L-Gk05N1ShkZLcrQig8yPRltRT8s",
        authDomain: "chordsheettxtviewer.firebaseapp.com",
        databaseURL: "https://chordsheettxtviewer-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "chordsheettxtviewer",
        storageBucket: "chordsheettxtviewer.firebasestorage.app",
        messagingSenderId: "336810647120",
        appId: "1:336810647120:web:1349f6f9887c7ab7983b55"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    </script>

    <script src="firebase.js"></script>
    <script src="script.js"></script>
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Settings</h2>
            <div class="setting">
                <label for="dark-mode-toggle">Dark Mode</label>
                <input type="checkbox" id="dark-mode-toggle">
            </div>
            <div class="setting">
                <label for="font-select">Font</label>
                <select id="font-select">
                    <option value="sans-serif">Sans-serif</option>
                    <option value="serif">Serif</option>
                    <option value="monospace">Monospace</option>
                    <option value="Calibri">Calibri</option>
                    <option value="Arial">Arial</option>
                    <option value="Verdana">Verdana</option>
                </select>
            </div>
        </div>
    </div>
</body>
</html>
