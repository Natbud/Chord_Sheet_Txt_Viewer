<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text File Reader/Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Text File Reader/Editor</h1>
        <div class="main-content">
            <div id="file-browser">
                <h2>Files</h2>
                <ul id="file-list"></ul>
            </div>
            <div class="editor-container">
                <div class="buttons">
                    <button id="save-btn">Download File</button>
                </div>
                <textarea id="editor" placeholder="Select a file to view its content..."></textarea>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
